name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate protocol front matter
        run: python scripts/validate_protocols.py
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Generate indexes
        run: |
          python scripts/generate_comparison_index.py
          python scripts/generate_sitemap.py
          python scripts/generate_forms_index.py
      - name: Build site (strict)
        run: mkdocs build --strict
      # Zipped static site: can be copied to any internal web server
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: |
          python scripts/generate_comparison_index.py
          python scripts/generate_sitemap.py
          python scripts/generate_forms_index.py
      - run: mkdocs gh-deploy --force
