name: Deploy MkDocs
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - run: pip install mkdocs-material pymdown-extensions mkdocs-awesome-pages-plugin pyyaml
      - run: python scripts/generate_comparison_index.py
      - run: python scripts/generate_sitemap.py
      - run: python scripts/generate_forms_index.py
      - name: Inject GitHub issues token
        if: env.ISSUES_TOKEN != ''
        run: |
          python - <<'EOF'
          import json, os
          path = 'docs/javascripts/institution-config.json'
          with open(path) as f:
              cfg = json.load(f)
          cfg['github_token'] = os.environ['ISSUES_TOKEN']
          with open(path, 'w') as f:
              json.dump(cfg, f, indent=2)
          EOF
        env:
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
      - run: mkdocs gh-deploy --force