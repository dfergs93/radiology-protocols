# Institution Configuration
# Edit this file when forking for a new hospital deployment.

institution:
  name: "Radiology Department"
  short_name: "Radiology"
  # Full URL where the site is deployed (no trailing slash)
  site_url: "https://dfergs93.github.io/radiology-protocols"
  # Path prefix if hosted in a subdirectory (e.g. "/radiology-protocols")
  # Must match mkdocs.yml site_url path
  base_path: "/radiology-protocols"

contact:
  department_email: ""
  # Optional: link shown in site footer
  feedback_url: "https://github.com/dfergs93/radiology-protocols/issues/new"
  # Optional: fine-grained GitHub PAT with Issues: write scope on this repo.
  # When set, change requests are submitted directly via the GitHub API so
  # users do not need a GitHub account. If blank, the button opens the
  # GitHub new-issue page (requires the user to be logged in).
  github_token: ""

branding:
  # Path to logo relative to docs/
  logo: ""
  favicon: ""

# Sitemap output path (relative to repo root)
# This file is served at site_url/base_path/javascripts/sitemap.json
sitemap_output: "docs/javascripts/sitemap.json"
