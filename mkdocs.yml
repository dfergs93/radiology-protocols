site_name: Radiology Protocol Manager
site_url: https://dfergs93.github.io/radiology-protocols/

theme:
  name: material
  # No Google Fonts: the site must work on hospital networks with no internet access
  font: false
  features:
    - navigation.tabs
    # - navigation.expand
    # - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.integrate
  palette:
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
plugins:
  - search
  - awesome-pages

extra_css:
  - custom_css/extra.css

extra_javascript:
  - javascripts/acquisition-diagram.js
  - javascripts/acquisition-diagram-init.js
  - javascripts/protocol-compare.js
  - javascripts/request-change.js
  - javascripts/review-status.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
